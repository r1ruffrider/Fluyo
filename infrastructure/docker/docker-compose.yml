name: fluyo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluyo_local}
      POSTGRES_DB: ${POSTGRES_DB:-fluyo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fluyo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  fluyo_postgres_data:
    name: fluyo_postgres_data
