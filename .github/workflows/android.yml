name: Android foundation

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/mobile/android/foundation/v1/**"
      - "scripts/android-evidence.mjs"
      - "scripts/scan-android-evidence.mjs"
      - "scripts/summarize-android-test-failures.mjs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "contracts/mobile/android/foundation/v1/**"
      - "scripts/android-evidence.mjs"
      - "scripts/scan-android-evidence.mjs"
      - "scripts/summarize-android-test-failures.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-evidence:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: minimum
            label: minimum API 29 emulator evidence
            sdk: 29
            device: Pixel 2
            device_class: smallest_supported
            environment: development
          - leg: current
            label: current API 37 emulator evidence
            sdk: 37
            device: Pixel 9 Pro XL
            device_class: large_current
            environment: staging_and_inert_production
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${#SOURCE_SHA}" = 40

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install pinned SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_CHANNEL=3
          PLATFORM_PACKAGE="platforms;android-37.0"
          if [[ "${{ matrix.leg }}" == "minimum" ]]; then
            IMAGE_PACKAGE="system-images;android-29;google_apis;x86_64"
          else
            IMAGE_PACKAGE="system-images;android-37.0;google_apis;x86_64"
          fi
          sdkmanager --channel="$SDK_CHANNEL" \
            "platform-tools" \
            "emulator" \
            "$PLATFORM_PACKAGE" \
            "build-tools;36.0.0" \
            "$IMAGE_PACKAGE"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/emulator/emulator"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          if [[ "${{ matrix.leg }}" == "current" ]]; then
            test -d "$ANDROID_HOME/system-images/android-37.0"
            ln -sfn "$ANDROID_HOME/system-images/android-37.0" "$ANDROID_HOME/system-images/android-37"
          fi

      - name: Enable hardware-accelerated emulator access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$USER":"$(id -gn)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Build and test exact matrix leg
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SHORT_SHA="${SOURCE_SHA:0:12}"
          RAW_LOG="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}-raw.log"
          RESOURCE_TABLE="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}-resources.txt"
          EMULATOR_LOG="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}-emulator.log"
          INSTRUMENT_LOG="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}-instrument.log"
          AVD_HOME="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}-avd"
          EMULATOR_PID=""
          cleanup() {
            if adb get-state >/dev/null 2>&1; then
              adb shell settings put system font_scale 1.0 >/dev/null 2>&1 || true
              adb shell settings put system accelerometer_rotation 1 >/dev/null 2>&1 || true
              adb shell settings put system user_rotation 0 >/dev/null 2>&1 || true
              adb shell settings put global animator_duration_scale 1 >/dev/null 2>&1 || true
              adb shell settings put global transition_animation_scale 1 >/dev/null 2>&1 || true
              adb shell settings put global window_animation_scale 1 >/dev/null 2>&1 || true
              adb uninstall com.fluyo.app.staging.test >/dev/null 2>&1 || true
              adb uninstall com.fluyo.app.staging >/dev/null 2>&1 || true
              adb uninstall com.fluyo.app.test >/dev/null 2>&1 || true
              adb uninstall com.fluyo.app >/dev/null 2>&1 || true
              adb emu kill >/dev/null 2>&1 || true
            fi
            if [[ -n "$EMULATOR_PID" ]]; then
              kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            fi
            rm -f "$RAW_LOG" "$RESOURCE_TABLE" "$EMULATOR_LOG" "$INSTRUMENT_LOG"
            rm -rf "$AVD_HOME"
          }
          trap cleanup EXIT
          COMMON=(--no-daemon --warning-mode=fail -Pandroid.sdk.channel=3 "-PfluyoSourceCommitShort=$SHORT_SHA")
          run_gradle_phase() {
            local phase="$1"
            shift
            set +e
            ./gradlew "${COMMON[@]}" "$@" >"$RAW_LOG" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              cd "$GITHUB_WORKSPACE"
              node scripts/summarize-android-test-failures.mjs \
                apps/android/app/build/outputs/androidTest-results/managedDevice \
                --phase "$phase"
              echo "Android matrix leg failed; raw output was discarded"
              exit "$status"
            fi
          }
          verify_packaged_pseudo_locales() {
            local apk="$1"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk" >"$RESOURCE_TABLE"
            if ! grep -Eqi 'en[-_]r?XA' "$RESOURCE_TABLE"; then
              rm -f "$RESOURCE_TABLE"
              echo "Android pseudo-locale packaging check failed: expansion probe missing"
              exit 1
            fi
            if ! grep -Eqi 'ar[-_]r?XB' "$RESOURCE_TABLE"; then
              rm -f "$RESOURCE_TABLE"
              echo "Android pseudo-locale packaging check failed: RTL probe missing"
              exit 1
            fi
            rm -f "$RESOURCE_TABLE"
          }
          start_current_emulator() {
            export ANDROID_AVD_HOME="$AVD_HOME"
            local last_phase="unknown"
            for attempt in 1 2; do
              rm -rf "$AVD_HOME"
              mkdir -p "$AVD_HOME"
              if ! echo no | avdmanager create avd --force \
                --name fluyo-api37 \
                --package "system-images;android-37.0;google_apis;x86_64" \
                --device "pixel_9_pro_xl" >"$EMULATOR_LOG" 2>&1; then
                last_phase="avd_creation"
                continue
              fi
              "$ANDROID_HOME/emulator/emulator" -avd fluyo-api37 \
                -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save \
                -no-metrics -wipe-data -accel on -cores 2 -memory 4096 \
                -gpu swiftshader_indirect >"$EMULATOR_LOG" 2>&1 &
              EMULATOR_PID=$!
              if ! timeout 180 adb wait-for-device >"$INSTRUMENT_LOG" 2>&1; then
                last_phase="device_connection"
              elif ! timeout 360 bash -c \
                'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done' \
                >"$INSTRUMENT_LOG" 2>&1; then
                last_phase="boot_completion"
              else
                adb shell settings put system font_scale 1.0 >"$INSTRUMENT_LOG" 2>&1
                adb shell settings put global animator_duration_scale 1 >"$INSTRUMENT_LOG" 2>&1
                adb shell settings put global transition_animation_scale 1 >"$INSTRUMENT_LOG" 2>&1
                adb shell settings put global window_animation_scale 1 >"$INSTRUMENT_LOG" 2>&1
                rm -f "$EMULATOR_LOG" "$INSTRUMENT_LOG"
                echo "Android current-runtime emulator became ready; raw output was discarded"
                return
              fi
              adb emu kill >/dev/null 2>&1 || true
              kill "$EMULATOR_PID" >/dev/null 2>&1 || true
              EMULATOR_PID=""
              adb kill-server >/dev/null 2>&1 || true
              rm -f "$EMULATOR_LOG" "$INSTRUMENT_LOG"
            done
            case "$last_phase" in
              avd_creation|device_connection|boot_completion) ;;
              *) last_phase="unknown" ;;
            esac
            echo "Android current-runtime setup failed; phase=$last_phase; category=unavailable; raw output was discarded"
            exit 1
          }
          run_manual_instrumentation() {
            local app_package="$1"
            local app_apk="$2"
            local test_apk="$3"
            adb install -r "$app_apk" >"$INSTRUMENT_LOG" 2>&1
            adb install -r "$test_apk" >>"$INSTRUMENT_LOG" 2>&1
            set +e
            adb shell am instrument -w -r \
              "$app_package.test/androidx.test.runner.AndroidJUnitRunner" \
              >>"$INSTRUMENT_LOG" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]] || grep -q 'FAILURES!!!' "$INSTRUMENT_LOG" || \
              ! grep -Eq '^OK \(6 tests\)$' "$INSTRUMENT_LOG"; then
              echo "Android current-runtime instrumentation failed; raw output was discarded"
              exit 1
            fi
            adb uninstall "$app_package.test" >/dev/null 2>&1 || true
            adb uninstall "$app_package" >/dev/null 2>&1 || true
            rm -f "$INSTRUMENT_LOG"
            echo "Android current-runtime instrumentation passed exactly 6 tests; raw output was discarded"
          }
          if [[ "${{ matrix.leg }}" == "minimum" ]]; then
            run_gradle_phase unit_test :app:testDevelopmentDebugUnitTest
            run_gradle_phase assemble_internal :app:assembleDevelopmentDebug
            verify_packaged_pseudo_locales app/build/outputs/apk/development/debug/app-development-debug.apk
            run_gradle_phase compile_instrumentation :app:compileDevelopmentDebugAndroidTestKotlin
            run_gradle_phase instrumentation_internal :app:smallApi29DevelopmentDebugAndroidTest
          else
            run_gradle_phase unit_test :app:testStagingDebugUnitTest
            run_gradle_phase assemble_internal :app:assembleStagingDebug
            verify_packaged_pseudo_locales app/build/outputs/apk/staging/debug/app-staging-debug.apk
            run_gradle_phase assemble_production_inert :app:assembleProductionDebug
            run_gradle_phase lint :app:lintDevelopmentDebug
            run_gradle_phase compile_instrumentation \
              :app:assembleStagingDebugAndroidTest \
              :app:assembleProductionDebugAndroidTest
            start_current_emulator
            run_manual_instrumentation \
              com.fluyo.app.staging \
              app/build/outputs/apk/staging/debug/app-staging-debug.apk \
              app/build/outputs/apk/androidTest/staging/debug/app-staging-debug-androidTest.apk
            run_manual_instrumentation \
              com.fluyo.app \
              app/build/outputs/apk/production/debug/app-production-debug.apk \
              app/build/outputs/apk/androidTest/production/debug/app-production-debug-androidTest.apk
            run_gradle_phase baseline_profile :app:generateDevelopmentBaselineProfile
          fi
          echo "Android matrix leg completed with raw output discarded"

      - name: Inspect, classify, and scan artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/artifacts/android-${{ matrix.leg }}"
          TEMP="$RUNNER_TEMP/fluyo-android-${{ matrix.leg }}"
          mkdir -p "$OUT/logs" "$TEMP"
          if [[ "${{ matrix.leg }}" == "minimum" ]]; then
            cp apps/android/app/build/outputs/apk/development/debug/app-development-debug.apk "$TEMP/Fluyo-development-debug.apk"
            ARTIFACT="$OUT/Fluyo-minimum-emulator.zip"
            ACCESSIBILITY_SETTING="compose_semantics_api29"
            CURRENT_RUNTIME_TEST_COUNT="not_applicable"
          else
            cp apps/android/app/build/outputs/apk/staging/debug/app-staging-debug.apk "$TEMP/Fluyo-staging-debug.apk"
            cp apps/android/app/build/outputs/apk/production/debug/app-production-debug.apk "$TEMP/Fluyo-production-inert-debug.apk"
            ARTIFACT="$OUT/Fluyo-current-emulator.zip"
            ACCESSIBILITY_SETTING="bounded_uiautomator_black_box_api37"
            CURRENT_RUNTIME_TEST_COUNT="6"
          fi
          for apk in "$TEMP"/*.apk; do
            apksigner verify --print-certs "$apk" >"$TEMP/signing.txt"
            grep -q "Android Debug" "$TEMP/signing.txt"
            aapt dump permissions "$apk" >"$TEMP/permissions.txt"
            ! grep -q "uses-permission:" "$TEMP/permissions.txt"
            aapt dump xmltree "$apk" AndroidManifest.xml >"$TEMP/manifest.txt"
            test "$(grep -c 'E: activity' "$TEMP/manifest.txt")" -eq 1
            grep -q 'com.fluyo.app.MainActivity' "$TEMP/manifest.txt"
            test "$(grep -c 'E: provider' "$TEMP/manifest.txt")" -eq 1
            grep -q 'androidx.startup.InitializationProvider' "$TEMP/manifest.txt"
            test "$(grep -c 'E: receiver' "$TEMP/manifest.txt" || true)" -eq 0
            test "$(grep -c 'E: service' "$TEMP/manifest.txt" || true)" -eq 0
            test "$(grep -c 'android:exported.*0xffffffff' "$TEMP/manifest.txt")" -eq 1
          done
          node scripts/scan-android-evidence.mjs "$TEMP"
          (cd "$TEMP" && zip -q -9 "$ARTIFACT" ./*.apk)
          cat >"$OUT/logs/${{ matrix.leg }}.log" <<EOF
          sourceCommit=$SOURCE_SHA
          buildIdentifier=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.leg }}
          runnerImage=ubuntu-24.04
          deviceClass=${{ matrix.device_class }}
          deviceKind=emulator
          deviceApi=${{ matrix.sdk }}
          environment=${{ matrix.environment }}
          result=passed
          signingClassification=non_production_debug_signed
          accessibilitySetting=$ACCESSIBILITY_SETTING
          currentRuntimeTestsPerFlavor=$CURRENT_RUNTIME_TEST_COUNT
          EOF
          node -e 'const fs=require("fs"); const current=process.argv[2]==="current"; fs.writeFileSync(process.argv[1], JSON.stringify({sourceCommit:process.env.SOURCE_SHA,buildIdentifier:process.env.GITHUB_RUN_ID+"-"+process.env.GITHUB_RUN_ATTEMPT+"-"+process.argv[2],runnerImage:"ubuntu-24.04",deviceModel:process.argv[3],deviceClass:process.argv[4],deviceApi:Number(process.argv[5]),environment:process.argv[6],accessibilitySetting:current?"bounded_uiautomator_black_box_api37":"compose_semantics_api29",command:current?"pinned Gradle build, bounded UiAutomator black-box checks, manifest, signing, and privacy gate":"pinned Gradle build, Compose semantics instrumentation, manifest, signing, and privacy gate"},null,2)+"\n")' "$TEMP/metadata.json" "${{ matrix.leg }}" "${{ matrix.device }}" "${{ matrix.device_class }}" "${{ matrix.sdk }}" "${{ matrix.environment }}"
          node scripts/android-evidence.mjs generate "${{ matrix.leg }}" contracts/mobile/android/foundation/v1/foundation-policy.json "$TEMP/metadata.json" "$ARTIFACT" "$OUT/evidence-${{ matrix.leg }}.json"
          node scripts/scan-android-evidence.mjs "$OUT"
          rm -rf "$TEMP"
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$OUT/logs" -type f | wc -l)" -eq 1

      - name: Upload sanitized leg evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.leg }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/android-${{ matrix.leg }}
          if-no-files-found: error
          retention-days: 7

  aggregate-evidence:
    name: sanitized Android foundation evidence
    needs: emulator-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download minimum evidence
        uses: actions/download-artifact@v4
        with:
          name: android-minimum-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/input/minimum
      - name: Download current evidence
        uses: actions/download-artifact@v4
        with:
          name: android-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/input/current
      - name: Aggregate and validate exact scenario union
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/android-evidence.mjs aggregate \
            contracts/mobile/android/foundation/v1/foundation-policy.json \
            artifacts/input/minimum/evidence-minimum.json \
            artifacts/input/current/evidence-current.json \
            artifacts/input/minimum/Fluyo-minimum-emulator.zip \
            artifacts/input/current/Fluyo-current-emulator.zip \
            artifacts/android-foundation
          mkdir -p artifacts/android-foundation/logs
          cp artifacts/input/minimum/logs/minimum.log artifacts/android-foundation/logs/
          cp artifacts/input/current/logs/current.log artifacts/android-foundation/logs/
          node scripts/scan-android-evidence.mjs artifacts/android-foundation
          test "$(find artifacts/android-foundation -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find artifacts/android-foundation/logs -type f | wc -l)" -eq 2
      - name: Upload sanitized aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-foundation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/android-foundation
          if-no-files-found: error
          retention-days: 7
