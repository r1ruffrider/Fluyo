name: iOS current canonical proof v2
run-name: ios-current-canonical-proof-v2 target=${{ inputs.target_sha }} pr=72 pass=${{ inputs.pass_ordinal }} predecessor=${{ inputs.previous_run_id }} digest=${{ inputs.expected_workflow_sha256 }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Frozen PR 72 exact-head SHA
        required: true
        type: string
      pass_ordinal:
        description: Controlled canonical-proof pass
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      previous_run_id:
        description: Literal none for pass 1; exact successful predecessor workflow run ID for passes 2 and 3
        required: true
        type: string
      expected_workflow_sha256:
        description: SHA-256 of this workflow at the dispatched main revision
        required: true
        type: string

permissions: {}

concurrency:
  group: ios-current-canonical-proof-v2-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: iOS current canonical preflight v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Validate closed dispatch syntax and context
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PASS_ORDINAL: ${{ inputs.pass_ordinal }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PASS_ORDINAL" == "1" || "$PASS_ORDINAL" == "2" || "$PASS_ORDINAL" == "3" ]]
          if [[ "$PASS_ORDINAL" == "1" ]]; then
            test "$PREVIOUS_RUN_ID" = "none"
          else
            [[ "$PREVIOUS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$EXPECTED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$RUN_ATTEMPT" = "1"

      - name: Bind workflow, HOLD pull request, predecessor, and ordinal
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PASS_ORDINAL: ${{ inputs.pass_ordinal }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
        with:
          script: |
            const { createHash } = require("node:crypto");
            const assert = (condition, message) => {
              if (!condition) throw new Error(message);
            };
            const canonicalId = (value, label) => {
              const text = String(value);
              assert(/^[1-9][0-9]*$/.test(text), `${label} is not a canonical positive integer`);
              const bigint = BigInt(text);
              assert(bigint <= BigInt(Number.MAX_SAFE_INTEGER), `${label} exceeds safe integer range`);
              const number = Number(bigint);
              assert(String(number) === text, `${label} does not round-trip canonically`);
              return number;
            };
            const safePaginate = async (route, parameters, field, label) => {
              const values = [];
              for (let page = 1; page <= 100; page += 1) {
                const response = await github.request(route, {
                  ...parameters,
                  per_page: 100,
                  page,
                });
                const pageValues = response.data[field];
                assert(Array.isArray(pageValues), `${label} pagination payload is invalid`);
                assert(values.length + pageValues.length <= 10000, `${label} exceeds 10000 records`);
                values.push(...pageValues);
                if (pageValues.length < 100) return values;
              }
              throw new Error(`${label} exceeds 100 pages`);
            };
            const { owner, repo } = context.repo;
            const targetSha = process.env.TARGET_SHA;
            const prNumber = 72;
            const passOrdinal = Number(process.env.PASS_ORDINAL);
            const previousRunId =
              passOrdinal === 1
                ? process.env.PREVIOUS_RUN_ID
                : canonicalId(process.env.PREVIOUS_RUN_ID, "previous_run_id");
            const currentRunId = canonicalId(context.runId, "current run ID");
            const expectedDigest = process.env.EXPECTED_WORKFLOW_SHA256;
            const workflowPath = ".github/workflows/ios-current-canonical-proof.yml";
            const workflowId = "ios-current-canonical-proof.yml";
            const identityPrefix = "ios-current-canonical-proof-v2";
            const canonicalJobName = "iOS current canonical exact-head proof v2";
            const expectedJobNames = [
              "iOS current canonical preflight v2",
              canonicalJobName,
              "iOS current canonical postflight v2",
            ];

            assert(context.ref === "refs/heads/main", "Dispatch ref must be main");
            assert([1, 2, 3].includes(passOrdinal), "Pass ordinal is not closed");
            assert(
              passOrdinal === 1 ? previousRunId === "none" : Number.isSafeInteger(previousRunId),
              "Predecessor syntax does not match pass ordinal",
            );

            const workflowFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: context.sha,
            });
            assert(!Array.isArray(workflowFile.data), "Workflow path did not resolve to one file");
            assert(workflowFile.data.encoding === "base64", "Workflow content encoding is not base64");
            const workflowBytes = Buffer.from(workflowFile.data.content.replaceAll("\n", ""), "base64");
            const actualDigest = createHash("sha256").update(workflowBytes).digest("hex");
            assert(actualDigest === expectedDigest, "Workflow SHA-256 does not match dispatched revision");

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: 72,
            });
            assert(canonicalId(pull.number, "pull request API ID") === prNumber, "Pull request ID mismatch");
            assert(pull.state === "open", "Pull request must remain open");
            assert(pull.draft === true, "Pull request must remain draft/HOLD");
            assert(pull.base.ref === "main", "Pull request base must remain main");
            assert(pull.head.repo?.full_name === `${owner}/${repo}`, "Pull request must be same-repository");
            assert(pull.head.sha === targetSha, "Pull request head does not match target_sha");

            const priorRuns = await safePaginate(
              "GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs",
              {
                owner,
                repo,
                workflow_id: workflowId,
                event: "workflow_dispatch",
                branch: "main",
              },
              "workflow_runs",
              "workflow runs",
            );
            const titlePattern =
              /^ios-current-canonical-proof-v2 target=([0-9a-f]{40}) pr=72 pass=([123]) predecessor=(none|[1-9][0-9]*) digest=([0-9a-f]{64})$/;
            const parseV2Title = (run, label) => {
              canonicalId(run.id, `${label} API ID`);
              const title = String(run.display_title ?? "");
              if (!title.startsWith(identityPrefix)) return null;
              const match = title.match(titlePattern);
              assert(match, `${label} has malformed v2 identity`);
              const ordinal = Number(match[2]);
              const predecessor =
                match[3] === "none"
                  ? "none"
                  : canonicalId(match[3], `${label} title predecessor ID`);
              assert(
                ordinal === 1 ? predecessor === "none" : Number.isSafeInteger(predecessor),
                `${label} has invalid predecessor semantics`,
              );
              assert(Number.isSafeInteger(run.run_attempt), `${label} attempt is invalid`);
              assert(typeof run.status === "string", `${label} status is invalid`);
              assert(
                run.conclusion === null || typeof run.conclusion === "string",
                `${label} conclusion is invalid`,
              );
              return {
                target: match[1],
                ordinal,
                predecessor,
                digest: match[4],
                title,
              };
            };
            const parsedHistory = priorRuns.map((run) => ({ run, identity: parseV2Title(run, "workflow run") }));
            assert(
              !parsedHistory.some(
                ({ run, identity }) =>
                  identity !== null &&
                  canonicalId(run.id, "workflow run API ID") !== currentRunId &&
                  identity.target === targetSha &&
                  identity.ordinal === passOrdinal,
              ),
              `Pass ${passOrdinal} has already been dispatched for this target`,
            );

            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: currentRunId,
            });
            assert(canonicalId(currentRun.id, "current run API ID") === currentRunId, "Current run ID mismatch");
            assert(currentRun.event === "workflow_dispatch", "Current run event mismatch");
            assert(currentRun.path === workflowPath, "Current run workflow path mismatch");
            assert(currentRun.head_branch === "main", "Current run branch mismatch");
            assert(currentRun.head_sha === context.sha, "Current run workflow revision mismatch");
            assert(currentRun.run_attempt === 1, "Current run must be attempt 1");
            const currentIdentity = parseV2Title(currentRun, "current run");
            assert(currentIdentity !== null, "Current run is not a v2 identity");
            assert(currentIdentity.target === targetSha, "Current run target identity mismatch");
            assert(currentIdentity.ordinal === passOrdinal, "Current run ordinal identity mismatch");
            assert(currentIdentity.predecessor === previousRunId, "Current run predecessor identity mismatch");
            assert(currentIdentity.digest === expectedDigest, "Current run digest identity mismatch");

            const validatePredecessor = async (
              runId,
              ordinal,
              expectedPredecessor,
              successorStartedAt,
              label,
            ) => {
              const ancestorMatches = parsedHistory.filter(
                ({ identity }) =>
                  identity !== null && identity.target === targetSha && identity.ordinal === ordinal,
              );
              assert(ancestorMatches.length === 1, `${label} ancestor identity is not unique`);
              assert(
                canonicalId(ancestorMatches[0].run.id, `${label} history run API ID`) === runId,
                `${label} ancestor ID does not match supplied predecessor`,
              );
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              assert(canonicalId(run.id, `${label} run API ID`) === runId, `${label} run ID mismatch`);
              assert(run.status === "completed", `${label} run must be terminal`);
              assert(run.conclusion === "success", `${label} run must conclude SUCCESS`);
              assert(run.run_attempt === 1, `${label} run must be attempt 1`);
              assert(run.event === "workflow_dispatch", `${label} event mismatch`);
              assert(run.path === workflowPath, `${label} workflow path mismatch`);
              assert(run.head_branch === "main", `${label} branch mismatch`);
              const identity = parseV2Title(run, `${label} run`);
              assert(identity !== null, `${label} is not a v2 identity`);
              assert(identity.target === targetSha, `${label} target mismatch`);
              assert(identity.ordinal === ordinal, `${label} ordinal mismatch`);
              if (expectedPredecessor !== null) {
                assert(identity.predecessor === expectedPredecessor, `${label} predecessor mismatch`);
              }
              assert(identity.digest === expectedDigest, `${label} digest identity mismatch`);

              const predecessorWorkflowFile = await github.rest.repos.getContent({
                owner,
                repo,
                path: workflowPath,
                ref: run.head_sha,
              });
              assert(
                !Array.isArray(predecessorWorkflowFile.data) &&
                  predecessorWorkflowFile.data.encoding === "base64",
                `${label} workflow content is invalid`,
              );
              const predecessorBytes = Buffer.from(
                predecessorWorkflowFile.data.content.replaceAll("\n", ""),
                "base64",
              );
              assert(
                createHash("sha256").update(predecessorBytes).digest("hex") === expectedDigest,
                `${label} workflow digest mismatch`,
              );

              const jobs = await safePaginate(
                "GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs",
                { owner, repo, run_id: runId, filter: "latest" },
                "jobs",
                `${label} jobs`,
              );
              assert(jobs.length === 3, `${label} must contain exactly three jobs`);
              assert(new Set(jobs.map((job) => job.name)).size === 3, `${label} job names are duplicated`);
              assert(
                [...jobs.map((job) => job.name)].sort().join("\n") === [...expectedJobNames].sort().join("\n"),
                `${label} job topology mismatch`,
              );
              for (const job of jobs) {
                canonicalId(job.id, `${label} job API ID`);
                assert(job.status === "completed", `${label} job must be terminal`);
                assert(job.conclusion === "success", `${label} job must conclude SUCCESS`);
                assert(job.run_attempt === 1, `${label} job must be attempt 1`);
              }
              const postflightJob = jobs.find(
                (job) => job.name === "iOS current canonical postflight v2",
              );
              assert(postflightJob, `${label} postflight job is missing`);
              const completedAt = Date.parse(postflightJob.completed_at);
              const successorAt = Date.parse(successorStartedAt);
              assert(Number.isFinite(completedAt) && Number.isFinite(successorAt), `${label} timestamps invalid`);
              assert(completedAt <= successorAt, `${label} completed after successor started`);

              const artifacts = await safePaginate(
                "GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts",
                { owner, repo, run_id: runId },
                "artifacts",
                `${label} artifacts`,
              );
              assert(artifacts.length === 1, `${label} must contain exactly one artifact`);
              const artifact = artifacts[0];
              canonicalId(artifact.id, `${label} artifact API ID`);
              assert(
                artifact.name ===
                  `ios-current-canonical-proof-v2-${targetSha}-pass-${ordinal}-run-${runId}`,
                `${label} artifact name mismatch`,
              );
              assert(artifact.expired === false, `${label} artifact is expired`);
              assert(
                Number.isSafeInteger(artifact.size_in_bytes) &&
                  artifact.size_in_bytes >= 1 &&
                  artifact.size_in_bytes <= 283115520,
                `${label} artifact size is out of bounds`,
              );
              assert(
                canonicalId(artifact.workflow_run?.id, `${label} artifact workflow run API ID`) === runId,
                `${label} artifact run binding mismatch`,
              );
              return { run, identity };
            };

            if (passOrdinal === 1) {
              assert(previousRunId === "none", "Pass 1 predecessor must be none");
            } else if (passOrdinal === 2) {
              assert(previousRunId !== currentRunId, "Pass 2 predecessor must differ from current run");
              await validatePredecessor(
                previousRunId,
                1,
                "none",
                currentRun.run_started_at,
                "pass 1 predecessor",
              );
            } else {
              assert(previousRunId !== currentRunId, "Pass 3 predecessor must differ from current run");
              const passTwo = await validatePredecessor(
                previousRunId,
                2,
                null,
                currentRun.run_started_at,
                "pass 2 predecessor",
              );
              const passOneRunId = passTwo.identity.predecessor;
              assert(Number.isSafeInteger(passOneRunId), "Pass 2 predecessor title does not bind pass 1");
              assert(passOneRunId !== previousRunId, "Pass 1 and pass 2 run IDs must differ");
              assert(passOneRunId !== currentRunId, "Pass 1 and pass 3 run IDs must differ");
              await validatePredecessor(
                passOneRunId,
                1,
                "none",
                passTwo.run.run_started_at,
                "transitive pass 1 predecessor",
              );
            }

  canonical-current-ios:
    name: iOS current canonical exact-head proof v2
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact clean target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify frozen proof dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, realpathSync } from "node:fs";
          import { resolve, sep } from "node:path";

          const expected = new Map([
            ["scripts/ios-ci.sh", [16051, "bbe271e424ffa10a3c26f671093fd818bf41a432f48856597c98ff6c5bc8b553"]],
            ["scripts/summarize-ios-test-failures.mjs", [14618, "71102fdaa7a7fa8279c372fee406253d4b95c531a30155b6583ff8d70598818a"]],
            ["scripts/github-workflow-annotation.mjs", [1015, "7fb096c9bae2aafa43ef2e5ca614c215983179ac8cb5090c2fcac3ee75737da0"]],
            ["scripts/verify-android-auth-kernel-results.mjs", [3081, "d0345c97a5a548519348555150d2e004b6f7790960fbd1639b7d860f66b8fe03"]],
            ["scripts/scan-ios-evidence.mjs", [2516, "7ab4c066860f7fa2a5054708057ef9c4448def4063983fbd0400aba3813a5cf4"]],
            ["scripts/ios-evidence.mjs", [13925, "06ad8ccb25bb5a9be238ab1ac2bfc26fb0446b6a8c35938020f594269bc071b4"]],
            ["contracts/mobile/ios/foundation/v1/foundation-policy.json", [12501, "a52f0895c7940d6cee1f4479f7b0efb9444d35136330027f752d79e243b5530f"]],
            ["contracts/mobile/auth-runtime-synthetic/v1/vectors.tsv", [22395, "a51283c6dffdb9372521c184864a09e6e8bd83cdcf71b8eed6d61960f549b222"]],
          ]);
          if (expected.size !== 8) throw new Error("Frozen execution map must contain exactly eight files");
          const checkout = realpathSync(process.cwd());
          for (const [relative, [size, sha256]] of expected) {
            const candidate = resolve(checkout, relative);
            const stat = lstatSync(candidate);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1) {
              throw new Error(`Unsafe frozen execution file: ${relative}`);
            }
            const canonical = realpathSync(candidate);
            if (!canonical.startsWith(`${checkout}${sep}`)) {
              throw new Error(`Frozen execution file escapes checkout: ${relative}`);
            }
            if (stat.size !== size) throw new Error(`Frozen execution file size mismatch: ${relative}`);
            const actual = createHash("sha256").update(readFileSync(canonical)).digest("hex");
            if (actual !== sha256) throw new Error(`Frozen execution file SHA-256 mismatch: ${relative}`);
          }
          NODE

      - name: Build test and scan current runtime
        shell: bash
        env:
          FLUYO_SOURCE_SHA: ${{ inputs.target_sha }}
          FLUYO_IOS_EVIDENCE_LEG: current
          FLUYO_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          FLUYO_XCODE_PREFIX: Xcode 26.6
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: bash scripts/ios-ci.sh

      - name: Validate trusted sanitized exact-run evidence
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_BUILD_IDENTIFIER: ${{ github.run_id }}-1-current
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          test -d artifacts/ios-current
          test -f artifacts/ios-current/evidence-current.json
          if find artifacts/ios-current \( -name '*.xcresult' -o -name '*.resultbundle' -o -name '*.xccovarchive' -o -name '*.xctest' \) -print -quit | grep -q .; then
            echo "Raw XCTest or result bundles are forbidden" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            closeSync,
            createReadStream,
            lstatSync,
            openSync,
            readFileSync,
            readSync,
            readdirSync,
            realpathSync,
            statSync,
          } from "node:fs";
          import { basename, join, resolve, sep } from "node:path";
          import { Transform } from "node:stream";
          import { createInflateRaw } from "node:zlib";

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const directory = "artifacts/ios-current";
          const expectedSha = process.env.TARGET_SHA;
          const expectedBuild = process.env.EXPECTED_BUILD_IDENTIFIER;

          const restrictedPatterns = [
            /\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{12,}\b/i,
            /\beyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}\b/,
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
            /\bAuthorization\s*:\s*Bearer\s+[A-Za-z0-9._~-]{8,}/i,
            /\bFLUYO_TEST_(?:ADRIANA|ELANA)_(?:EMAIL|PASSWORD)\b/i,
            /\b(?:cus|sub|price|evt|cs_(?:test|live))_[A-Za-z0-9]{8,}\b/,
            /\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b/,
            /\/Users\/[^/\s]+\//,
            /[A-Za-z]:\\Users\\[^\\\s]+\\/,
            /https?:\/\/(?:api|auth)\.fluyo\.(?!example\.test)[^\s"']*/i,
            /\b(?:DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY)\s*[=:]\s*\S+/i,
            /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i,
          ];
          const scanText = (text, label) => {
            for (const pattern of restrictedPatterns) {
              pattern.lastIndex = 0;
              assert(!pattern.test(text), `Restricted value in ${label}`);
            }
          };
          const controlFree = (value, label, maximum = 4096) => {
            assert(typeof value === "string", `${label} must be a string`);
            assert(value.length > 0 && value.length <= maximum, `${label} length is invalid`);
            assert(!/[\u0000-\u001f\u007f]/u.test(value), `${label} contains a control character`);
          };
          const exactKeys = (value, keys, label) => {
            assert(
              JSON.stringify(Object.keys(value)) === JSON.stringify(keys),
              `${label} keys or key order mismatch`,
            );
          };
          const parseStrictJson = (text) => {
            let index = 0;
            const whitespace = () => {
              while (/[\t\n\r ]/.test(text[index] ?? "")) index += 1;
            };
            const string = () => {
              assert(text[index] === '"', "JSON string expected");
              const start = index++;
              while (index < text.length) {
                const character = text[index++];
                if (character === '"') return JSON.parse(text.slice(start, index));
                if (character === "\\") {
                  const escaped = text[index++];
                  if (escaped === "u") {
                    assert(/^[0-9a-fA-F]{4}$/.test(text.slice(index, index + 4)), "Invalid JSON escape");
                    index += 4;
                  } else {
                    assert('"\\/bfnrt'.includes(escaped), "Invalid JSON escape");
                  }
                } else {
                  assert(character.charCodeAt(0) >= 0x20, "Unescaped JSON control character");
                }
              }
              throw new Error("Unterminated JSON string");
            };
            const value = () => {
              whitespace();
              if (text[index] === '"') return string();
              if (text[index] === "{") {
                index += 1;
                whitespace();
                const object = Object.create(null);
                const seen = new Set();
                if (text[index] === "}") {
                  index += 1;
                  return object;
                }
                while (true) {
                  whitespace();
                  const key = string();
                  assert(!seen.has(key), `Duplicate JSON key: ${key}`);
                  seen.add(key);
                  whitespace();
                  assert(text[index++] === ":", "JSON colon expected");
                  object[key] = value();
                  whitespace();
                  const delimiter = text[index++];
                  if (delimiter === "}") return object;
                  assert(delimiter === ",", "JSON object delimiter expected");
                }
              }
              if (text[index] === "[") {
                index += 1;
                whitespace();
                const array = [];
                if (text[index] === "]") {
                  index += 1;
                  return array;
                }
                while (true) {
                  array.push(value());
                  whitespace();
                  const delimiter = text[index++];
                  if (delimiter === "]") return array;
                  assert(delimiter === ",", "JSON array delimiter expected");
                }
              }
              for (const [token, parsed] of [
                ["true", true],
                ["false", false],
                ["null", null],
              ]) {
                if (text.startsWith(token, index)) {
                  index += token.length;
                  return parsed;
                }
              }
              const match = /^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?/.exec(
                text.slice(index),
              );
              assert(match, "Invalid JSON value");
              index += match[0].length;
              const parsed = Number(match[0]);
              assert(Number.isFinite(parsed), "Non-finite JSON number");
              return parsed;
            };
            const parsed = value();
            whitespace();
            assert(index === text.length, "Trailing JSON content");
            return parsed;
          };

          const root = realpathSync(directory);
          const rootStat = lstatSync(directory);
          assert(rootStat.isDirectory() && !rootStat.isSymbolicLink(), "Evidence root must be a directory");
          const inventory = readdirSync(directory).sort();
          assert(
            JSON.stringify(inventory) ===
              JSON.stringify(["Fluyo-current-simulator.zip", "evidence-current.json", "logs"]),
            `Unsafe evidence inventory: ${inventory.join(",")}`,
          );
          const logsDirectory = join(directory, "logs");
          const logsStat = lstatSync(logsDirectory);
          assert(logsStat.isDirectory() && !logsStat.isSymbolicLink(), "logs must be a real directory");
          assert(realpathSync(logsDirectory).startsWith(`${root}${sep}`), "logs escapes evidence root");
          assert(
            JSON.stringify(readdirSync(logsDirectory).sort()) === JSON.stringify(["current.log"]),
            "Unsafe evidence log inventory",
          );
          const lockFile = (relative, minimum, maximum) => {
            const path = join(directory, relative);
            const stat = lstatSync(path);
            assert(stat.isFile() && !stat.isSymbolicLink(), `${relative} must be a regular file`);
            assert(stat.nlink === 1, `${relative} must have one link`);
            assert(realpathSync(path).startsWith(`${root}${sep}`), `${relative} escapes evidence root`);
            assert(stat.size >= minimum && stat.size <= maximum, `${relative} size is out of bounds`);
            return { path, size: stat.size };
          };
          const zip = lockFile("Fluyo-current-simulator.zip", 1, 268435456);
          const json = lockFile("evidence-current.json", 1, 1048576);
          const log = lockFile("logs/current.log", 1, 65536);
          assert(zip.size + json.size + log.size <= 269549568, "Evidence total size exceeds bound");
          scanText(inventory.join("\n") + "\nlogs/current.log", "evidence filenames");

          const jsonText = readFileSync(json.path, "utf8");
          const logText = readFileSync(log.path, "utf8");
          scanText(jsonText, "evidence JSON");
          scanText(logText, "evidence log");
          const evidence = parseStrictJson(jsonText);
          const rootKeys = [
            "schemaVersion",
            "evidenceLeg",
            "sourceCommit",
            "buildIdentifier",
            "signing",
            "artifactFile",
            "artifactHash",
            "executions",
            "remainingUnattempted",
          ];
          exactKeys(evidence, rootKeys, "Evidence root");
          assert(evidence.schemaVersion === "1.0.0", "Evidence schema version mismatch");
          assert(evidence.evidenceLeg === "current", "Evidence leg mismatch");
          assert(evidence.sourceCommit === expectedSha, "Evidence sourceCommit mismatch");
          assert(evidence.buildIdentifier === expectedBuild, "Evidence buildIdentifier mismatch");
          assert(evidence.signing === "disabled_unsigned_simulator_only", "Evidence signing mismatch");
          assert(evidence.artifactFile === "Fluyo-current-simulator.zip", "Evidence artifact file mismatch");
          assert(/^[0-9a-f]{64}$/.test(evidence.artifactHash), "Evidence artifact hash is invalid");
          const artifactHasher = createHash("sha256");
          let rawZipScanTail = "";
          for await (const chunk of createReadStream(zip.path, { highWaterMark: 65536 })) {
            artifactHasher.update(chunk);
            const text = rawZipScanTail + chunk.toString("latin1");
            scanText(text, "raw ZIP bytes");
            rawZipScanTail = text.slice(-4096);
          }
          const artifactHash = artifactHasher.digest("hex");
          assert(evidence.artifactHash === artifactHash, "Evidence artifact hash mismatch");
          const scenarioIds = [
            "ios_config_development",
            "ios_config_staging",
            "ios_release_inert",
            "ios_deterministic_launch",
            "ios_loading_accessible_state",
            "ios_signed_out_accessible_state",
            "ios_safe_error_accessible_state",
            "ios_system_reduce_motion",
            "ios_motion_interruption_static_equivalent",
            "ios_dynamic_type_200_percent",
            "ios_voiceover_order_and_names",
            "ios_minimum_touch_targets",
            "ios_focus_order_and_target",
            "ios_contrast_and_non_color_status",
            "ios_keyboard_and_switch_focus",
            "ios_large_current_iphone_simulator",
            "ios_portrait_layout",
            "ios_landscape_fallback",
            "ios_asset_rendering_provenance_semantics",
            "ios_privacy_manifest_inventory",
            "ios_artifact_secret_scan",
          ];
          const executionFields = [
            "sourceCommit",
            "buildIdentifier",
            "platform",
            "macosVersion",
            "xcodeVersion",
            "swiftVersion",
            "deviceModel",
            "deviceClass",
            "deviceKind",
            "deviceOsVersion",
            "environment",
            "accessibilitySetting",
            "command",
            "expected",
            "observed",
            "result",
            "artifactHash",
            "secretScanResult",
          ];
          assert(Array.isArray(evidence.executions), "Evidence executions must be an array");
          assert(evidence.executions.length === 21, "Evidence must contain exactly 21 executions");
          const first = evidence.executions[0];
          for (const execution of evidence.executions) {
            exactKeys(execution, ["scenarioId", ...executionFields], "Evidence execution");
            for (const key of ["scenarioId", ...executionFields]) controlFree(execution[key], `execution.${key}`);
            assert(execution.sourceCommit === expectedSha, "Execution sourceCommit mismatch");
            assert(execution.buildIdentifier === expectedBuild, "Execution buildIdentifier mismatch");
            assert(execution.platform === "ios", "Execution platform mismatch");
            const expectedEnvironment =
              execution.scenarioId === "ios_config_staging" ||
              execution.scenarioId === "ios_artifact_secret_scan"
                ? "staging"
                : execution.scenarioId === "ios_release_inert"
                  ? "release"
                  : "development";
            const accessibilityByScenario = {
              ios_system_reduce_motion: "reduce_motion",
              ios_motion_interruption_static_equivalent: "reduce_motion",
              ios_dynamic_type_200_percent: "accessibility_extra_extra_extra_large",
              ios_voiceover_order_and_names: "accessibility_tree_semantics",
              ios_focus_order_and_target: "accessibility_focus_binding",
              ios_contrast_and_non_color_status: "light_and_dark_appearance",
              ios_keyboard_and_switch_focus: "accessibility_tree_focus",
              ios_landscape_fallback: "large_text_landscape",
            };
            assert(execution.environment === expectedEnvironment, "Execution environment mismatch");
            assert(
              execution.accessibilitySetting ===
                (accessibilityByScenario[execution.scenarioId] ?? "default"),
              "Execution accessibility setting mismatch",
            );
            assert(execution.deviceClass === "large_current", "Execution device class mismatch");
            assert(execution.deviceKind === "simulator", "Execution device kind mismatch");
            assert(execution.xcodeVersion.startsWith("Xcode 26.6"), "Execution Xcode mismatch");
            assert(
              execution.command === "xcodebuild full test plus Debug, Staging, and inert Release builds",
              "Execution command mismatch",
            );
            assert(execution.result === "passed", "Execution result mismatch");
            assert(execution.secretScanResult === "passed", "Execution scan result mismatch");
            assert(execution.artifactHash === artifactHash, "Execution artifact hash mismatch");
            for (const key of [
              "macosVersion",
              "xcodeVersion",
              "swiftVersion",
              "deviceModel",
              "deviceOsVersion",
              "command",
            ]) {
              assert(execution[key] === first[key], `Execution ${key} identity drift`);
            }
          }
          assert(
            JSON.stringify(evidence.executions.map((execution) => execution.scenarioId)) ===
              JSON.stringify(scenarioIds),
            "Execution scenario order mismatch",
          );
          assert(
            JSON.stringify(evidence.remainingUnattempted) ===
              JSON.stringify([
                "ios_smallest_supported_iphone_simulator",
                "ios_physical_iphone_evidence",
              ]),
            "remainingUnattempted mismatch",
          );

          assert(logText.endsWith("\n"), "Evidence log must be newline terminated");
          const logLines = logText.slice(0, -1).split("\n");
          assert(logLines.length === 9, "Evidence log must contain exactly nine lines");
          const logKeys = [
            "sourceCommit",
            "buildIdentifier",
            "command",
            "environment",
            "deviceModel",
            "deviceClass",
            "deviceKind",
            "deviceOsVersion",
            "result",
          ];
          const logValues = Object.create(null);
          logLines.forEach((line, index) => {
            const equals = line.indexOf("=");
            assert(equals > 0, "Evidence log line is invalid");
            const key = line.slice(0, equals);
            const value = line.slice(equals + 1);
            assert(key === logKeys[index], "Evidence log key order mismatch");
            assert(!(key in logValues), "Duplicate evidence log key");
            controlFree(value, `log.${key}`);
            logValues[key] = value;
          });
          assert(logValues.sourceCommit === expectedSha, "Evidence log source mismatch");
          assert(logValues.buildIdentifier === expectedBuild, "Evidence log build mismatch");
          assert(logValues.command === first.command, "Evidence log command mismatch");
          assert(logValues.environment === "development", "Evidence log environment mismatch");
          assert(logValues.deviceModel === first.deviceModel, "Evidence log device model mismatch");
          assert(logValues.deviceClass === "large_current", "Evidence log device class mismatch");
          assert(logValues.deviceKind === "simulator", "Evidence log device kind mismatch");
          assert(logValues.deviceOsVersion === first.deviceOsVersion, "Evidence log OS mismatch");
          assert(logValues.result === "passed", "Evidence log result mismatch");

          const crcTable = new Uint32Array(256);
          for (let index = 0; index < 256; index += 1) {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) {
              value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            }
            crcTable[index] = value >>> 0;
          }
          const readAt = (descriptor, offset, length) => {
            const buffer = Buffer.alloc(length);
            let total = 0;
            while (total < length) {
              const count = readSync(descriptor, buffer, total, length - total, offset + total);
              assert(count > 0, "Unexpected ZIP EOF");
              total += count;
            }
            return buffer;
          };
          const supportedExtraFields = new Set([0x000a, 0x5455, 0x5855, 0x7855, 0x7875]);
          const rejectZip64Extra = (extra) => {
            let offset = 0;
            while (offset < extra.length) {
              assert(offset + 4 <= extra.length, "Malformed ZIP extra field");
              const identifier = extra.readUInt16LE(offset);
              const length = extra.readUInt16LE(offset + 2);
              offset += 4;
              assert(offset + length <= extra.length, "Truncated ZIP extra field");
              assert(identifier !== 0x0001, "ZIP64 is forbidden");
              assert(supportedExtraFields.has(identifier), "Unsupported ZIP extra field");
              offset += length;
            }
          };
          const zipDescriptor = openSync(zip.path, "r");
          try {
            const tailLength = Math.min(zip.size, 22 + 65535);
            const tailOffset = zip.size - tailLength;
            const tail = readAt(zipDescriptor, tailOffset, tailLength);
            let eocdOffset = -1;
            for (let index = tail.length - 22; index >= 0; index -= 1) {
              if (
                tail.readUInt32LE(index) === 0x06054b50 &&
                index + 22 + tail.readUInt16LE(index + 20) === tail.length
              ) {
                eocdOffset = tailOffset + index;
                break;
              }
            }
            assert(eocdOffset >= 0, "ZIP EOCD not found");
            const eocd = readAt(zipDescriptor, eocdOffset, 22);
            assert(eocd.readUInt16LE(20) === 0, "ZIP EOCD comments are forbidden");
            assert(eocd.readUInt16LE(4) === 0 && eocd.readUInt16LE(6) === 0, "Multi-disk ZIP forbidden");
            const entriesOnDisk = eocd.readUInt16LE(8);
            const entryCount = eocd.readUInt16LE(10);
            const centralSize = eocd.readUInt32LE(12);
            const centralOffset = eocd.readUInt32LE(16);
            assert(entriesOnDisk === entryCount, "ZIP entry count mismatch");
            assert(entryCount > 0 && entryCount <= 4096, "ZIP entry count is out of bounds");
            assert(entryCount !== 0xffff && centralSize !== 0xffffffff && centralOffset !== 0xffffffff, "ZIP64 is forbidden");
            assert(centralOffset + centralSize === eocdOffset, "ZIP central directory bounds mismatch");
            const decoder = new TextDecoder("utf-8", { fatal: true });
            const entries = [];
            const foldedNames = new Set();
            let cursor = centralOffset;
            let rootEntries = 0;
            let totalCompressed = 0;
            let totalUncompressed = 0;
            for (let index = 0; index < entryCount; index += 1) {
              const header = readAt(zipDescriptor, cursor, 46);
              assert(header.readUInt32LE(0) === 0x02014b50, "Invalid ZIP central header");
              const madeBy = header.readUInt16LE(4) >>> 8;
              const needed = header.readUInt16LE(6);
              const flags = header.readUInt16LE(8);
              const method = header.readUInt16LE(10);
              const crc = header.readUInt32LE(16);
              const compressed = header.readUInt32LE(20);
              const uncompressed = header.readUInt32LE(24);
              const nameLength = header.readUInt16LE(28);
              const extraLength = header.readUInt16LE(30);
              const commentLength = header.readUInt16LE(32);
              assert(commentLength === 0, "ZIP entry comments are forbidden");
              const disk = header.readUInt16LE(34);
              const external = header.readUInt32LE(38);
              const localOffset = header.readUInt32LE(42);
              assert(needed < 45, "ZIP64 version is forbidden");
              assert((flags & 1) === 0, "Encrypted ZIP entry forbidden");
              assert((flags & ~0x080e) === 0, "Unsupported ZIP general-purpose flag");
              assert(method === 0 || method === 8, "Unsupported ZIP compression method");
              assert(method === 8 || (flags & 0x0006) === 0, "Invalid stored-entry compression flags");
              assert(disk === 0, "Multi-disk ZIP entry forbidden");
              assert(compressed !== 0xffffffff && uncompressed !== 0xffffffff && localOffset !== 0xffffffff, "ZIP64 entry forbidden");
              assert(nameLength > 0 && nameLength <= 512, "ZIP path length is out of bounds");
              const variable = readAt(zipDescriptor, cursor + 46, nameLength + extraLength + commentLength);
              const nameBytes = variable.subarray(0, nameLength);
              const extra = variable.subarray(nameLength, nameLength + extraLength);
              rejectZip64Extra(extra);
              const name = decoder.decode(nameBytes);
              controlFree(name, "ZIP path", 512);
              assert(!name.includes("\\") && !name.includes("//"), "Unsafe ZIP path separator");
              assert(!name.startsWith("/") && !/^[A-Za-z]:/.test(name), "Absolute ZIP path forbidden");
              const parts = name.split("/");
              if (name.endsWith("/")) parts.pop();
              assert(parts.length > 0 && parts.every((part) => part !== "" && part !== "." && part !== ".."), "ZIP traversal path forbidden");
              assert(name === "Fluyo.app/" || name.startsWith("Fluyo.app/"), "ZIP entry outside Fluyo.app root");
              if (name === "Fluyo.app/") rootEntries += 1;
              const folded = name.normalize("NFC").toLocaleLowerCase("en-US");
              assert(!foldedNames.has(folded), "Duplicate case-folded ZIP path");
              foldedNames.add(folded);
              assert(!/\.(?:xcresult|resultbundle|xccovarchive|xctest)\/?$/i.test(name), "Raw result bundle in ZIP");
              scanText(name, "ZIP filename");
              const unixType = madeBy === 3 ? (external >>> 16) & 0xf000 : 0;
              const directoryEntry = name.endsWith("/");
              assert(unixType === 0 || unixType === 0x4000 || unixType === 0x8000, "ZIP link or special entry forbidden");
              assert(unixType !== 0x4000 || directoryEntry, "ZIP directory type mismatch");
              assert(unixType !== 0x8000 || !directoryEntry, "ZIP regular-file type mismatch");
              assert((external & 0x10) === 0 || directoryEntry, "ZIP DOS directory type mismatch");
              assert(uncompressed <= 134217728, "ZIP entry uncompressed size exceeds bound");
              assert(compressed > 0 || uncompressed === 0, "Zero-compressed nonempty ZIP entry forbidden");
              assert(compressed === 0 || uncompressed <= compressed * 200, "ZIP entry ratio exceeds 200:1");
              totalCompressed += compressed;
              totalUncompressed += uncompressed;
              entries.push({ name, nameBytes, flags, method, crc, compressed, uncompressed, localOffset });
              cursor += 46 + nameLength + extraLength + commentLength;
            }
            assert(cursor === centralOffset + centralSize, "ZIP central directory length mismatch");
            assert(rootEntries === 1, "ZIP must contain exactly one Fluyo.app root");
            assert(foldedNames.has("fluyo.app/fluyo"), "ZIP missing Fluyo.app/Fluyo");
            assert(foldedNames.has("fluyo.app/info.plist"), "ZIP missing Fluyo.app/Info.plist");
            assert(totalCompressed <= 268435456, "ZIP compressed total exceeds bound");
            assert(totalUncompressed <= 536870912, "ZIP uncompressed total exceeds bound");
            assert(totalCompressed > 0 && totalUncompressed <= totalCompressed * 100, "ZIP overall ratio exceeds 100:1");

            const ranges = [];
            for (const entry of entries) {
              const local = readAt(zipDescriptor, entry.localOffset, 30);
              assert(local.readUInt32LE(0) === 0x04034b50, "Invalid ZIP local header");
              const localFlags = local.readUInt16LE(6);
              const localMethod = local.readUInt16LE(8);
              const localCrc = local.readUInt32LE(14);
              const localCompressed = local.readUInt32LE(18);
              const localUncompressed = local.readUInt32LE(22);
              const localNameLength = local.readUInt16LE(26);
              const localExtraLength = local.readUInt16LE(28);
              assert(localFlags === entry.flags && localMethod === entry.method, "ZIP local header identity mismatch");
              const variable = readAt(zipDescriptor, entry.localOffset + 30, localNameLength + localExtraLength);
              assert(variable.subarray(0, localNameLength).equals(entry.nameBytes), "ZIP local path mismatch");
              rejectZip64Extra(variable.subarray(localNameLength));
              if ((entry.flags & 8) === 0) {
                assert(localCrc === entry.crc, "ZIP local CRC mismatch");
                assert(localCompressed === entry.compressed, "ZIP local compressed size mismatch");
                assert(localUncompressed === entry.uncompressed, "ZIP local uncompressed size mismatch");
              }
              const dataStart = entry.localOffset + 30 + localNameLength + localExtraLength;
              const dataEnd = dataStart + entry.compressed;
              assert(dataEnd <= centralOffset, "ZIP entry data is out of bounds");
              let rangeEnd = dataEnd;
              if ((entry.flags & 8) !== 0) {
                const descriptorPrefix = readAt(zipDescriptor, dataEnd, 4);
                const signed = descriptorPrefix.readUInt32LE(0) === 0x08074b50;
                const descriptor = readAt(zipDescriptor, dataEnd, signed ? 16 : 12);
                const base = signed ? 4 : 0;
                assert(descriptor.readUInt32LE(base) === entry.crc, "ZIP descriptor CRC mismatch");
                assert(descriptor.readUInt32LE(base + 4) === entry.compressed, "ZIP descriptor compressed size mismatch");
                assert(descriptor.readUInt32LE(base + 8) === entry.uncompressed, "ZIP descriptor uncompressed size mismatch");
                rangeEnd += signed ? 16 : 12;
              }
              assert(rangeEnd <= centralOffset, "ZIP local record overlaps central directory");
              ranges.push([entry.localOffset, rangeEnd]);

              let compressedRead = 0;
              let uncompressedRead = 0;
              let crc = 0xffffffff;
              let scanTail = "";
              if (entry.compressed > 0) {
                const counter = new Transform({
                  transform(chunk, _encoding, callback) {
                    compressedRead += chunk.length;
                    callback(null, chunk);
                  },
                });
                const counted = createReadStream(zip.path, {
                  start: dataStart,
                  end: dataEnd - 1,
                  highWaterMark: 65536,
                }).pipe(counter);
                const output = entry.method === 8 ? counted.pipe(createInflateRaw()) : counted;
                for await (const chunk of output) {
                  uncompressedRead += chunk.length;
                  assert(uncompressedRead <= entry.uncompressed, "ZIP entry inflated beyond declared size");
                  for (const byte of chunk) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
                  const text = scanTail + chunk.toString("latin1");
                  scanText(text, `ZIP data ${entry.name}`);
                  scanTail = text.slice(-4096);
                }
              }
              crc = (crc ^ 0xffffffff) >>> 0;
              assert(compressedRead === entry.compressed, "ZIP compressed read length mismatch");
              assert(uncompressedRead === entry.uncompressed, "ZIP uncompressed read length mismatch");
              assert(crc === entry.crc, "ZIP streamed CRC mismatch");
            }
            ranges.sort((left, right) => left[0] - right[0]);
            assert(ranges[0][0] === 0, "ZIP preamble is forbidden");
            for (let index = 1; index < ranges.length; index += 1) {
              assert(
                ranges[index - 1][1] === ranges[index][0],
                "ZIP local records must be exactly adjacent",
              );
            }
            assert(ranges.at(-1)[1] === centralOffset, "Unaccounted ZIP bytes before central directory");
          } finally {
            closeSync(zipDescriptor);
          }
          NODE

      - name: Upload sanitized current-runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-current-canonical-proof-v2-${{ inputs.target_sha }}-pass-${{ inputs.pass_ordinal }}-run-${{ github.run_id }}
          path: artifacts/ios-current
          if-no-files-found: error
          retention-days: 7

  postflight:
    name: iOS current canonical postflight v2
    needs: [preflight, canonical-current-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download exact run-unique sanitized artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-current-canonical-proof-v2-${{ inputs.target_sha }}-pass-${{ inputs.pass_ordinal }}-run-${{ github.run_id }}
          path: artifacts/ios-current-postflight

      - name: Independently validate final proof and draft HOLD state
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PASS_ORDINAL: ${{ inputs.pass_ordinal }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          EXPECTED_BUILD_IDENTIFIER: ${{ github.run_id }}-1-current
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          EXPECTED_ARTIFACT_NAME: ios-current-canonical-proof-v2-${{ inputs.target_sha }}-pass-${{ inputs.pass_ordinal }}-run-${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            closeSync,
            createReadStream,
            lstatSync,
            openSync,
            readFileSync,
            readSync,
            readdirSync,
            realpathSync,
            statSync,
          } from "node:fs";
          import { basename, join, resolve, sep } from "node:path";
          import { Transform } from "node:stream";
          import { createInflateRaw } from "node:zlib";

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const directory = "artifacts/ios-current-postflight";
          const expectedSha = process.env.TARGET_SHA;
          const expectedBuild = process.env.EXPECTED_BUILD_IDENTIFIER;

          const restrictedPatterns = [
            /\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{12,}\b/i,
            /\beyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}\b/,
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
            /\bAuthorization\s*:\s*Bearer\s+[A-Za-z0-9._~-]{8,}/i,
            /\bFLUYO_TEST_(?:ADRIANA|ELANA)_(?:EMAIL|PASSWORD)\b/i,
            /\b(?:cus|sub|price|evt|cs_(?:test|live))_[A-Za-z0-9]{8,}\b/,
            /\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b/,
            /\/Users\/[^/\s]+\//,
            /[A-Za-z]:\\Users\\[^\\\s]+\\/,
            /https?:\/\/(?:api|auth)\.fluyo\.(?!example\.test)[^\s"']*/i,
            /\b(?:DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY)\s*[=:]\s*\S+/i,
            /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i,
          ];
          const scanText = (text, label) => {
            for (const pattern of restrictedPatterns) {
              pattern.lastIndex = 0;
              assert(!pattern.test(text), `Restricted value in ${label}`);
            }
          };
          const controlFree = (value, label, maximum = 4096) => {
            assert(typeof value === "string", `${label} must be a string`);
            assert(value.length > 0 && value.length <= maximum, `${label} length is invalid`);
            assert(!/[\u0000-\u001f\u007f]/u.test(value), `${label} contains a control character`);
          };
          const exactKeys = (value, keys, label) => {
            assert(
              JSON.stringify(Object.keys(value)) === JSON.stringify(keys),
