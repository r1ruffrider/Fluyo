            canonicalJobName,
            "iOS current canonical postflight v2",
          ];
          assert(process.env.WORKFLOW_REF === "refs/heads/main", "Postflight workflow ref mismatch");
          assert(process.env.RUN_ATTEMPT === "1", "Postflight run attempt mismatch");
          assert([1, 2, 3].includes(passOrdinal), "Postflight pass ordinal mismatch");
          assert(
            passOrdinal === 1 ? previousRunId === "none" : Number.isSafeInteger(previousRunId),
            "Postflight predecessor syntax does not match pass ordinal",
          );

          const run = await api(`/repos/${owner}/${repo}/actions/runs/${runId}`);
          assert(canonicalId(run.id, "current run API ID") === runId, "Current run API ID mismatch");
          assert(run.event === "workflow_dispatch", "Current run event mismatch");
          assert(run.run_attempt === 1, "Current run must be attempt 1");
          assert(run.status === "in_progress", "Current run must be in progress during postflight");
          assert(run.head_branch === "main", "Current run branch mismatch");
          assert(run.head_sha === process.env.WORKFLOW_SHA, "Current run workflow SHA mismatch");
          assert(run.path === workflowPath, "Current run workflow path mismatch");
          const workflowFile = await api(
            `/repos/${owner}/${repo}/contents/${workflowPath}?ref=${process.env.WORKFLOW_SHA}`,
          );
          assert(workflowFile.encoding === "base64", "Postflight workflow content encoding mismatch");
          const workflowBytes = Buffer.from(workflowFile.content.replaceAll("\n", ""), "base64");
          const workflowDigest = createHash("sha256").update(workflowBytes).digest("hex");
          assert(workflowDigest === expectedDigest, "Postflight workflow SHA-256 mismatch");

          const titlePattern =
            /^ios-current-canonical-proof-v2 target=([0-9a-f]{40}) pr=72 pass=([123]) predecessor=(none|[1-9][0-9]*) digest=([0-9a-f]{64})$/;
          const parseV2Title = (candidate, label) => {
            canonicalId(candidate.id, `${label} API ID`);
            const title = String(candidate.display_title ?? "");
            if (!title.startsWith(identityPrefix)) return null;
            const match = title.match(titlePattern);
            assert(match, `${label} has malformed v2 identity`);
            const ordinal = Number(match[2]);
            const predecessor =
              match[3] === "none"
                ? "none"
                : canonicalId(match[3], `${label} title predecessor ID`);
            assert(
              ordinal === 1 ? predecessor === "none" : Number.isSafeInteger(predecessor),
              `${label} has invalid predecessor semantics`,
            );
            assert(Number.isSafeInteger(candidate.run_attempt), `${label} attempt is invalid`);
            assert(typeof candidate.status === "string", `${label} status is invalid`);
            assert(
              candidate.conclusion === null || typeof candidate.conclusion === "string",
              `${label} conclusion is invalid`,
            );
            return {
              target: match[1],
              ordinal,
              predecessor,
              digest: match[4],
              title,
            };
          };
          const currentIdentity = parseV2Title(run, "current run");
          assert(currentIdentity !== null, "Current run is not a v2 identity");
          assert(currentIdentity.target === expectedSha, "Current run target identity mismatch");
          assert(currentIdentity.ordinal === passOrdinal, "Current run ordinal identity mismatch");
          assert(currentIdentity.predecessor === previousRunId, "Current run predecessor identity mismatch");
          assert(currentIdentity.digest === expectedDigest, "Current run digest identity mismatch");

          const priorRuns = await safePaginate(
            `/repos/${owner}/${repo}/actions/workflows/ios-current-canonical-proof.yml/runs?event=workflow_dispatch&branch=main`,
            "workflow_runs",
            "workflow runs",
          );
          const parsedHistory = priorRuns.map((prior) => ({
            prior,
            identity: parseV2Title(prior, "workflow run"),
          }));
          assert(
            !parsedHistory.some(
              ({ prior, identity }) =>
                identity !== null &&
                canonicalId(prior.id, "workflow run API ID") !== runId &&
                identity.target === expectedSha &&
                identity.ordinal === passOrdinal,
            ),
            `Pass ${passOrdinal} was duplicated for this target`,
          );

          const validatePredecessor = async (
            predecessorRunId,
            ordinal,
            expectedPredecessor,
            successorStartedAt,
            label,
          ) => {
            const ancestorMatches = parsedHistory.filter(
              ({ identity }) =>
                identity !== null && identity.target === expectedSha && identity.ordinal === ordinal,
            );
            assert(ancestorMatches.length === 1, `${label} ancestor identity is not unique`);
            assert(
              canonicalId(ancestorMatches[0].prior.id, `${label} history run API ID`) ===
                predecessorRunId,
              `${label} ancestor ID does not match supplied predecessor`,
            );
            const predecessor = await api(
              `/repos/${owner}/${repo}/actions/runs/${predecessorRunId}`,
            );
            assert(
              canonicalId(predecessor.id, `${label} run API ID`) === predecessorRunId,
              `${label} run ID mismatch`,
            );
            assert(predecessor.status === "completed", `${label} run must be terminal`);
            assert(predecessor.conclusion === "success", `${label} run must conclude SUCCESS`);
            assert(predecessor.run_attempt === 1, `${label} run must be attempt 1`);
            assert(predecessor.event === "workflow_dispatch", `${label} event mismatch`);
            assert(predecessor.path === workflowPath, `${label} workflow path mismatch`);
            assert(predecessor.head_branch === "main", `${label} branch mismatch`);
            const identity = parseV2Title(predecessor, `${label} run`);
            assert(identity !== null, `${label} is not a v2 identity`);
            assert(identity.target === expectedSha, `${label} target mismatch`);
            assert(identity.ordinal === ordinal, `${label} ordinal mismatch`);
            if (expectedPredecessor !== null) {
              assert(identity.predecessor === expectedPredecessor, `${label} predecessor mismatch`);
            }
            assert(identity.digest === expectedDigest, `${label} digest identity mismatch`);

            const predecessorWorkflow = await api(
              `/repos/${owner}/${repo}/contents/${workflowPath}?ref=${predecessor.head_sha}`,
            );
            assert(predecessorWorkflow.encoding === "base64", `${label} workflow encoding mismatch`);
            const predecessorBytes = Buffer.from(
              predecessorWorkflow.content.replaceAll("\n", ""),
              "base64",
            );
            assert(
              createHash("sha256").update(predecessorBytes).digest("hex") === expectedDigest,
              `${label} workflow digest mismatch`,
            );

            const jobs = await safePaginate(
              `/repos/${owner}/${repo}/actions/runs/${predecessorRunId}/jobs?filter=latest`,
              "jobs",
              `${label} jobs`,
            );
            assert(jobs.length === 3, `${label} must contain exactly three jobs`);
            assert(new Set(jobs.map((job) => job.name)).size === 3, `${label} job names are duplicated`);
            assert(
              [...jobs.map((job) => job.name)].sort().join("\n") === [...expectedJobNames].sort().join("\n"),
              `${label} job topology mismatch`,
            );
            for (const job of jobs) {
              canonicalId(job.id, `${label} job API ID`);
              assert(job.status === "completed", `${label} job must be terminal`);
              assert(job.conclusion === "success", `${label} job must conclude SUCCESS`);
              assert(job.run_attempt === 1, `${label} job must be attempt 1`);
            }
            const postflightJob = jobs.find(
              (job) => job.name === "iOS current canonical postflight v2",
            );
            assert(postflightJob, `${label} postflight job is missing`);
            const completedAt = Date.parse(postflightJob.completed_at);
            const successorAt = Date.parse(successorStartedAt);
            assert(Number.isFinite(completedAt) && Number.isFinite(successorAt), `${label} timestamps invalid`);
            assert(completedAt <= successorAt, `${label} completed after successor started`);

            const predecessorArtifacts = await safePaginate(
              `/repos/${owner}/${repo}/actions/runs/${predecessorRunId}/artifacts`,
              "artifacts",
              `${label} artifacts`,
            );
            assert(predecessorArtifacts.length === 1, `${label} must contain exactly one artifact`);
            const predecessorArtifact = predecessorArtifacts[0];
            canonicalId(predecessorArtifact.id, `${label} artifact API ID`);
            assert(
              predecessorArtifact.name ===
                `ios-current-canonical-proof-v2-${expectedSha}-pass-${ordinal}-run-${predecessorRunId}`,
              `${label} artifact name mismatch`,
            );
            assert(predecessorArtifact.expired === false, `${label} artifact expired`);
            assert(
              Number.isSafeInteger(predecessorArtifact.size_in_bytes) &&
                predecessorArtifact.size_in_bytes >= 1 &&
                predecessorArtifact.size_in_bytes <= 283115520,
              `${label} artifact size is out of bounds`,
            );
            assert(
              canonicalId(
                predecessorArtifact.workflow_run?.id,
                `${label} artifact workflow run API ID`,
              ) === predecessorRunId,
              `${label} artifact run binding mismatch`,
            );
            return { run: predecessor, identity };
          };

          if (passOrdinal === 1) {
            assert(previousRunId === "none", "Pass 1 predecessor must be none");
          } else if (passOrdinal === 2) {
            assert(previousRunId !== runId, "Pass 2 predecessor must differ from current run");
            await validatePredecessor(
              previousRunId,
              1,
              "none",
              run.run_started_at,
              "pass 1 predecessor",
            );
          } else {
            assert(previousRunId !== runId, "Pass 3 predecessor must differ from current run");
            const passTwo = await validatePredecessor(
              previousRunId,
              2,
              null,
              run.run_started_at,
              "pass 2 predecessor",
            );
            const passOneRunId = passTwo.identity.predecessor;
            assert(Number.isSafeInteger(passOneRunId), "Pass 2 predecessor title does not bind pass 1");
            assert(passOneRunId !== previousRunId, "Pass 1 and pass 2 run IDs must differ");
            assert(passOneRunId !== runId, "Pass 1 and pass 3 run IDs must differ");
            await validatePredecessor(
              passOneRunId,
              1,
              "none",
              passTwo.run.run_started_at,
              "transitive pass 1 predecessor",
            );
          }

          const artifacts = await safePaginate(
            `/repos/${owner}/${repo}/actions/runs/${runId}/artifacts`,
            "artifacts",
            "current artifacts",
          );
          assert(artifacts.length === 1, "Current run must contain exactly one artifact");
          const artifact = artifacts[0];
          canonicalId(artifact.id, "current artifact API ID");
          assert(artifact.name === process.env.EXPECTED_ARTIFACT_NAME, "Artifact name mismatch");
          assert(artifact.expired === false, "Artifact expired before postflight");
          assert(
            Number.isSafeInteger(artifact.size_in_bytes) &&
              artifact.size_in_bytes >= 1 &&
              artifact.size_in_bytes <= 283115520,
            "Artifact API size is out of bounds",
          );
          assert(
            canonicalId(artifact.workflow_run?.id, "current artifact workflow run API ID") === runId,
            "Artifact run binding mismatch",
          );

          const pull = await api(`/repos/${owner}/${repo}/pulls/${prNumber}`);
          assert(canonicalId(pull.number, "pull request API ID") === prNumber, "Pull request ID mismatch");
          assert(pull.state === "open", "Pull request must remain open at postflight");
          assert(pull.draft === true, "Pull request must remain draft/HOLD at postflight");
          assert(pull.base.ref === "main", "Pull request base must remain main at postflight");
          assert(
            pull.head.repo?.full_name === `${owner}/${repo}`,
            "Pull request must remain same-repository at postflight",
          );
          assert(pull.head.sha === expectedSha, "Pull request head changed before postflight");
          NODE
